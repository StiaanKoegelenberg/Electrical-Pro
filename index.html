<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site has its own dark mode (navbar switch); stop browsers' "force dark pages" modes (e.g. Opera)
         darkening the light one. Dark mode sets color-scheme: dark in index.css. -->
    <meta name="color-scheme" content="only light" />
    <!-- Apply a saved dark-mode choice before the first paint, so dark-mode visitors don't see a white flash -->
    <script>
      try { if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
    </script>
    <!-- Filled in for each page from src/lib/page-meta.ts when the site is built (see vite.config.ts) -->
    <title></title>
    <meta name="description" content="" />
    <link rel="canonical" href="" />
    <meta property="og:url" content="" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <meta name="twitter:title" content="" />
    <meta name="twitter:description" content="" />
    <meta name="twitter:image" content="" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Electrical Pro" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="author" content="Electrical Pro" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Business details for Google. The phone number and hours are also on the page itself
         (src/lib/contact.ts, ContactSection.tsx and Footer.tsx), so change them in all three places. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Electrician",
        "name": "Electrical Pro",
        "url": "https://electricalpro.co.za/",
        "logo": "https://electricalpro.co.za/apple-touch-icon.png",
        "image": "https://electricalpro.co.za/og-image.jpg",
        "description": "Solar, commercial, agricultural and residential electrical contractors serving the Garden Route.",
        "telephone": "+27 44 874 7456",
        "areaServed": "Garden Route",
        "address": { "@type": "PostalAddress", "addressRegion": "Western Cape", "addressCountry": "ZA" },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "07:30",
          "closes": "17:00"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
