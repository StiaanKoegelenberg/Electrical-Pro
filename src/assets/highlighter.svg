<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <!-- One stroke of a highlighter pen, stretched behind each line of highlighted words (.highlighter in
       index.css). The shape was measured from the client's Basecamp reference; the ink is the site's
       electric blue (the accent colour), see-through like the glow round the 24-Hour Emergency Services
       box, and stronger and more even than the reference's, so the highlights stand out on the section's
       light grey-blue -->
  <defs>
    <!-- Along the stroke: the ink comes in over the first few px, is strongest just after, and pales only
         gently, to about three fifths of that near the end, then fades as the pen lifts off -->
    <linearGradient id="ink">
      <stop offset="0" stop-color="#1f8fff" stop-opacity=".34"/>
      <stop offset=".03" stop-color="#1f8fff" stop-opacity=".62"/>
      <stop offset=".12" stop-color="#1f8fff" stop-opacity=".58"/>
      <stop offset=".4" stop-color="#1f8fff" stop-opacity=".5"/>
      <stop offset=".65" stop-color="#1f8fff" stop-opacity=".44"/>
      <stop offset=".9" stop-color="#1f8fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1f8fff" stop-opacity=".2"/>
    </linearGradient>
    <!-- Across it: soft top and bottom edges, and the upper half a little denser than the lower -->
    <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset=".1" stop-color="#fff"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".88" stop-color="#fff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".4"/>
    </linearGradient>
    <mask id="soft">
      <rect width="100" height="100" fill="url(#feather)"/>
    </mask>
  </defs>
  <!-- Edges that waver slightly, as a hand-drawn stroke's do, narrowing a little as the pen eases off, then
       lifting away at the end: the bottom edge sweeps up, so the stroke finishes as a thin wisp along the top -->
  <path d="M0 3 C30 1.5 62 5.5 100 8 V20 C99 45 97 82 92 94 C62 95.5 30 98.5 0 99 Z" fill="url(#ink)" mask="url(#soft)"/>
</svg>
